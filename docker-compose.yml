# Local / laptop VPS:
#   http://LAN_IP/         serve (login) via gateway — use this on other devices
#   http://LAN_IP:3000     serve direct
#   http://LAN_IP:7001     admin POS
#   http://LAN_IP:7002     superadmin
#   http://LAN_IP:8081     API (host 8080 is often blocked on Windows)
#   localhost:5433         Postgres (local only)
#
# Other devices on the same Wi-Fi: set PUBLIC_* in `.env` to this
# machine's LAN IP (e.g. http://192.168.1.76:8080/api/v1/) then:
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: serve-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: nirvana_restro
    ports:
      - "5433:5432"
    volumes:
      - serve_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nirvana_restro"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: serve-api
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      ENV: development
      APP_NAME: SERVE
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: root
      DB_NAME: nirvana_restro
      DB_DIALECT: postgres
      POS_PUBLIC_URL: ${PUBLIC_ADMIN_URL:-http://localhost:7001}
      POS_PUBLIC_PORT: "7001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/resources:/app/resources

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8081/api/v1/}
        VITE_IMAGE_BASE_URL: ${PUBLIC_IMAGE_URL:-http://localhost:8081/}
        VITE_FRONTEND_BASE_URL: ${PUBLIC_ADMIN_URL:-http://localhost:7001}
        VITE_WEBSOCKET_BASE_URL: ${PUBLIC_WS_URL:-ws://localhost:8081}
        VITE_SERVE_URL: ${PUBLIC_SERVE_URL:-http://localhost:3000}
    container_name: serve-admin
    restart: unless-stopped
    ports:
      - "7001:8080"
    depends_on:
      - api

  superadmin:
    build:
      context: ./superadmin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_ORIGIN:-http://localhost:8081/api/v1}
        VITE_POS_URL: ${PUBLIC_ADMIN_URL:-http://localhost:7001}
    container_name: serve-superadmin
    restart: unless-stopped
    ports:
      - "7002:8080"
    depends_on:
      - api

  web:
    build:
      context: ./serve
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_ORIGIN:-http://localhost:8081/api/v1}
        NEXT_PUBLIC_POS_URL: ${PUBLIC_ADMIN_URL:-http://localhost:7001}
    container_name: serve-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  gateway:
    image: nginx:alpine
    container_name: serve-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  serve_pgdata:
